<main class="app-shell">
  <section class="todo-panel" aria-labelledby="app-title">
    <header class="todo-header">
      <p class="eyebrow">Angular Todo</p>
      <h1 id="app-title">今日のタスク</h1>
      <p class="summary">{{ remainingCount() }} active, {{ completedCount() }} done</p>
    </header>

    <form class="todo-form" (ngSubmit)="addTodo()">
      <label class="sr-only" for="new-todo">New task</label>
      <input
        id="new-todo"
        name="newTodo"
        type="text"
        autocomplete="off"
        placeholder="Add a task..."
        [ngModel]="newTodo()"
        (ngModelChange)="newTodo.set($event)"
      />
      <button type="submit" [disabled]="newTodo().trim().length === 0">Add</button>
    </form>

    <div class="toolbar" aria-label="Todo filters">
      <div class="filter-group" role="group" aria-label="Filter tasks">
        @for (option of filters; track option.value) {
          <button
            type="button"
            [class.active]="filter() === option.value"
            [attr.aria-pressed]="filter() === option.value"
            (click)="setFilter(option.value)"
          >
            {{ option.label }}
          </button>
        }
      </div>

      <button
        class="clear-button"
        type="button"
        [disabled]="completedCount() === 0"
        (click)="clearCompleted()"
      >
        Clear done
      </button>
    </div>

    <ul class="todo-list" aria-label="Tasks">
      @for (todo of visibleTodos(); track todo.id) {
        <li class="todo-item" [class.completed]="todo.completed">
          <label>
            <input type="checkbox" [checked]="todo.completed" (change)="toggleTodo(todo.id)" />
            <span>{{ todo.title }}</span>
          </label>
          <button
            class="remove-button"
            type="button"
            [attr.aria-label]="'Remove ' + todo.title"
            (click)="removeTodo(todo.id)"
          >
            &times;
          </button>
        </li>
      } @empty {
        <li class="empty-state">{{ emptyMessage() }}</li>
      }
    </ul>
  </section>
</main>
