services:
  - type: web
    name: focus-timer-app
    runtime: static
    branch: develop
    rootDir: focus-timer-app
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/focus-timer-app/browser
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
    buildFilter:
      paths:
        - render.yaml
        - focus-timer-app/**
    routes:
      - type: rewrite
        source: "/*"
        destination: /index.html
