<main class="focus-shell">
  <section class="timer-workspace" aria-labelledby="app-title">
    <header class="hero">
      <div>
        <p class="eyebrow">Focus Timer</p>
        <h1 id="app-title">Deep work, gently paced.</h1>
      </div>
      <p class="hero-copy">Choose a rhythm, start the timer, and let the session stay simple.</p>
    </header>

    <app-mode-selector
      [presets]="presets"
      [selectedMode]="selectedMode()"
      (modeSelected)="selectMode($event)"
    />

    <section class="timer-layout">
      <article class="timer-panel">
        <app-timer-display
          [caption]="activePreset().caption"
          [formattedTime]="formattedTime()"
          [statusText]="statusText()"
          [ringBackground]="ringBackground()"
        />

        <app-timer-controls
          [isRunning]="isRunning()"
          (timerToggled)="toggleTimer()"
          (timerReset)="resetTimer()"
          (sessionCompleted)="completeSession()"
        />
      </article>

      <app-session-stats
        [completedSessions]="completedSessions()"
        [focusMinutes]="focusMinutes()"
        [nextBreakLabel]="nextBreakLabel()"
        (recommendedBreakSelected)="selectRecommendedBreak()"
        (todayReset)="resetToday()"
      />
    </section>
  </section>
</main>
